# Run the app's tests on every pull request to dev, and on dev itself.
# Packages come from the test profile's lockfile (renv/profiles/test/renv.lock).
name: Tests

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RENV_PROFILE: test
      RENV_PATHS_CACHE: ${{ github.workspace }}/.renv-cache
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      # System libraries the R packages link to (sf, units and s2 come in
      # through ggpattern; igraph through escalation).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libuv1-dev libpng-dev \
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev libglpk-dev

      - name: Cache R packages
        uses: actions/cache@v5
        with:
          path: .renv-cache
          key: renv-${{ runner.os }}-r4.5.1-${{ hashFiles('renv/profiles/test/renv.lock') }}

      # The project's .Rprofile activates renv with the test profile and
      # installs the renv version the lockfile records.
      - name: Restore packages
        run: Rscript -e 'renv::restore(prompt = FALSE)'

      - name: Run tests
        run: Rscript -e 'shiny::runTests("app")'
