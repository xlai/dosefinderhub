# Build the browser (Shinylive) version of the app and keep it as a build
# artifact named "shinylive-site". It is not published: publishing to
# GitHub Pages from main is a later step (decision 0002).
# Adapted from the Shinylive build of ICR-EPAT/dtptite-shiny
# (https://github.com/ICR-EPAT/dtptite-shiny/tree/spike/shinylive-pages).
name: Shinylive build

on:
  pull_request:
    branches: [dev]
    paths:
      - "webr/**"
      - ".github/workflows/shinylive.yml"
  push:
    branches: [dev]
    paths:
      - "app/**"
      - "webr/**"
      - ".github/workflows/shinylive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shinylive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Shinylive uses webR binaries, not renv.lock. Keep the project's
      # .Rprofile from activating renv, so R uses the packages pak installs.
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      # shinylive::export() reads the installed packages to decide which
      # webR binaries to bundle, so the app's packages are installed here.
      # These are the packages the app's code uses (app/tests excluded).
      # pak also installs the system libraries they need.
      - name: Install packages
        run: |
          install.packages("pak")
          pak::pak(c(
            "shinylive", "shiny", "bslib", "bsicons", "htmltools", "shinyjs",
            "DT", "escalation", "BOIN", "dfcrm", "dplyr", "tidyr", "stringr",
            "tibble", "magrittr", "rlang", "ggplot2", "ggpattern", "markdown",
            "rmarkdown", "openxlsx"
          ))
        shell: Rscript {0}

      - name: Export
        run: Rscript webr/export.R

      - name: Upload site
        uses: actions/upload-artifact@v5
        with:
          name: shinylive-site
          path: _site
          retention-days: 14
